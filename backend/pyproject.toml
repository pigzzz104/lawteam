[project]
name = "lawteam-os-backend"
version = "0.1.0"
description = "LawTeam-OS multi-user legal case management and deterministic deadline engine"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlmodel>=0.0.22",
    "sqlalchemy>=2.0.35",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.6.0",
    "apscheduler>=3.10.4",
    "playwright>=1.48.0",
    "pdfplumber>=0.11.4",
    "chinesecalendar>=1.9.0",
    "httpx>=0.27.2",
    "icalendar>=6.0.0",
    "pyjwt>=2.9.0",
    "bcrypt>=4.2.0",
    "python-multipart>=0.0.12",
    "tzdata>=2024.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
